<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Gift Card</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts for playful text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap"
        rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

    <div class="container">
        <!-- Card 1: Hiii Cutu with Blur Backdrop -->
        <div class="card active" id="card1" onclick="nextCard(2)">
            <div class="card-bg"></div>
            <div class="card-content">
                <h1 class="script-font">hiii, cutu ✨</h1>
                <p class="tap-hint">Tap Tap</p>
            </div>
        </div>

        <!-- Card 2: Advance Birthday Greeting -->
        <div class="card" id="card2" onclick="nextCard(4)">
            <div class="card-content">
                <h1 class="bold-font gradient-text">Happyyy birthday in advance !! </h1>
                <p class="tap-hint">Tap Tap ➔</p>
            </div>
        </div>

        <!-- Card 4: 3D Flip Mystery Card -->
        <div class="card" id="card4">
            <div class="flip-card" onclick="flipCard()">
                <div class="flip-card-inner" id="flipCardInner">
                    <!-- Front Side -->
                    <div class="flip-card-front">
                        <span class="mystery-icon">❓</span>
                        <h2 class="bold-font">Tap Tap!</h2>
                    </div>
                    <!-- Back Side -->
                    <div class="flip-card-back">
                        <h2 class="bold-font gradient-text">SURPRISE!! ✨</h2>
                        <div class="gift-images">
                            <div class="gift-item">
                                <img src="https://res.insta360.com/dynamic/store/c364c4562fad6a7a520a57839889d99b/305524_fdb4ca0d-674c-4840-bc24-08f80c2b89ec.png"
                                    alt="Insta360 Camera" />
                            </div>
                            <div class="gift-item">
                                <img src="https://sm.pcmag.com/t/pcmag_me/photo/default/069ijpw1mwecx4qk8hyw0ch-3_2bsj.1920.jpg"
                                    alt="Amazon Kindle" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
